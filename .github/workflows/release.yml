name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checks
        run: swift run CruftChecks

      - name: Build release bundle
        run: ./scripts/make-app.sh

      # Zip from inside dist/ so the archive contains Cruft.app at its root,
      # and use ditto to preserve the bundle's resource forks and signature.
      - name: Archive
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Cruft.app Cruft-macOS.zip
          shasum -a 256 Cruft-macOS.zip > Cruft-macOS.zip.sha256
          cat Cruft-macOS.zip.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/Cruft-macOS.zip
            dist/Cruft-macOS.zip.sha256
          body: |
            ## Install

            Download `Cruft-macOS.zip`, unzip, and move `Cruft.app` to
            `/Applications`.

            **This build is unsigned**, so macOS will refuse the first launch.
            Right-click (or Control-click) the app → **Open** → **Open**. You
            only have to do this once. See the README for why, and for the
            `xattr` alternative.

            Some categories (Safari cache, Mail attachments) need **Full Disk
            Access** in System Settings → Privacy & Security. Without it they
            simply show as empty.

      # Tell the Homebrew tap a new release exists so it updates the cask right
      # away. Needs a fine-grained PAT with contents:write on
      # akatekhanh/homebrew-tap stored as TAP_GITHUB_TOKEN; without it the tap's
      # own scheduled workflow picks the release up within a few hours instead.
      - name: Notify Homebrew tap
        if: env.TAP_GITHUB_TOKEN != ''
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $TAP_GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/akatekhanh/homebrew-tap/dispatches \
            -d '{"event_type":"cruft-release","client_payload":{"tag":"${{ github.event.inputs.tag || github.ref_name }}"}}'
